[project]
name = "psychoacoustic-parameter-estimation-via-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy",
    "pandas",
    "torch",
    "librosa",
    "soundfile",
    "matplotlib",
    "mosqito",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "DL_model*",
    "data_preprocessing*",
    "visualize_training*",
]
namespaces = true
